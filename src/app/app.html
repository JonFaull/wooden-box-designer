<div class="app-shell">
  <app-settings-panel />

  <div class="viewport-wrapper">
    <div class="viewport-3d" [style.flex]="topFlex">
      <app-box-panel-three />
    </div>

    <div class="divider-handle" (mousedown)="onDividerMouseDown($event)">
      <div class="divider-line"></div>
    </div>

    <div class="viewport-2d" [style.flex]="bottomFlex">
      <app-box-panel-flat />
    </div>
  </div>
</div>
